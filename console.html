function editorScope(){const a=state.editor;return `<section class="card"><div class="cardHeader"><div><div class="cardTitle">Ambito</div><div class="cardHint">Scegli uno o più ambiti compatibili. Nessuna entità vuota viene creata.</div></div><button class="btnGhost" id="addScope">${svg('plus')}Aggiungi ambito</button></div>${a.templateKey==='unserved_segment'||a.templateKey==='detour'?segmentEditor():`<div class="stack">${a.informedEntities.map((e,i)=>scopeRow(e,i)).join('')||`<div class="empty" style="padding:32px"><strong>Nessun ambito</strong><span>Seleziona un ambito quando l’avviso ne richiede uno.</span></div>`}</div>`}</section>`;}

function segmentEditor(){const segs=state.editor._segments||[];if(!state.gtfs.data)return `<div class="callout warn"><div>${svg('route')}</div><div><strong>Carica prima un GTFS</strong><span>Il tratto usa il percorso reale del GTFS corrente. Vai in "Rubrica GTFS", carica l’operatore e poi torna qui.</span></div></div>`;if(!segs.length){state.editor._segments=[newSegment()];return `<div class="stack">${singleSegment(state.editor._segments[0],0)}</div><button class="btnGhost" id="addSegment">${svg('plus')}Aggiungi tratto</button>`;}return `<div class="stack">${segs.map((s,i)=>singleSegment(s,i)).join('')}</div><button class="btnGhost" id="addSegment">${svg('plus')}Aggiungi tratto</button>`;}
function singleSegment(s,i){const data=state.gtfs.data;const routes=data?[...data.routesById.values()]:[];const directions=data?getRouteDirections(s.routeId):[];const patterns=s.routeId&&s.directionId!=null?getPatterns(s.routeId,s.directionId):[];const pattern=patterns[s.patternIndex||0];return `<div class="scopeCard"><div class="scopeCardHeader"><div><div class="scopeTitle">Tratto ${i+1}</div><div class="scopeMeta">Linea → direzione → percorso → selezione tratto</div></div><button class="miniBtn" data-remove-segment="${i}" type="button">${svg('trash')}</button></div><div class="routePicker" style="margin-top:12px"><div class="field"><label>Linea</label><select data-segment-route="${i}"><option value="">Seleziona linea</option>${routes.map(r=>`<option value="${esc(r.route_id)}" ${s.routeId===r.route_id?'selected':''}>${esc(routeLabel(data,r.route_id))}</option>`).join('')}</select></div><div class="field"><label>Direzione</label><select data-segment-direction="${i}" ${!s.routeId?'disabled':''}><option value="">Seleziona direzione</option>${directions.map(d=>`<option value="${d.value}" ${s.directionId===d.value?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div></div>${patterns.length>1?`<div class="field" style="margin-top:10px"><label>Percorso</label><select data-segment-pattern="${i}">${patterns.map((p,pi)=>`<option value="${pi}" ${pi===(s.patternIndex||0)?'selected':''}>Percorso ${pi+1} · ${p.stops.length} fermate · ${p.count} corse</option>`).join('')}</select></div>`:''}<div class="patternBox" style="margin-top:11px">${!s.routeId||s.directionId==null?`<div class="empty" style="padding:22px"><strong>Nessun percorso</strong><span>${s.routeId&&directions.length===0?'Il GTFS corrente non contiene direction_id strutturato per questa linea.':'Seleziona linea e direzione per visualizzare il percorso.'}</span></div>`:pattern?`<div class="cardHeader"><div><div class="cardTitle">${esc(pattern.headsign||'Percorso normale')}</div><div class="cardHint">Selezione continua delle fermate del tratto.</div></div><span class="badge info">${pattern.stops.length} fermate</span></div><div class="stopList">${pattern.stops.map((st,idx)=>`<label class="stopItem"><input type="checkbox" data-segment-stop="${i}" data-stop-id="${esc(st.stop_id)}" ${s.stopIds.includes(st.stop_id)?'checked':''}><span><span class="stopName">${esc(st.stop_name)}</span><span class="stopId">${esc(st.stop_id)}</span></span><span class="stopSeq">${idx+1}</span></label>`).join('')}</div><div class="selectionSummary">${s.stopIds.length} fermate selezionate</div><div class="btnRow" style="margin-top:10px"><button class="btnGhost compact" data-select-range="${i}">${svg('route')}Imposta da fermata iniziale → finale</button></div>`:`<div class="callout warn"><div>${svg('alert')}</div><div><strong>Pattern non disponibile</strong><span>Il GTFS corrente non contiene un percorso per questa linea/direzione.</span></div></div>`}</div></div>`;}
function editorPeriod(){const a=state.editor;return `<section class="card"><div class="cardHeader"><div><div class="cardTitle">Periodo</div><div class="cardHint">Più periodi indipendenti. Una fine vuota significa nessuna fine impostata.</div></div><button class="btnGhost" id="addPeriod">${svg('plus')}Aggiungi periodo</button></div>${a.activePeriods.length?`<div class="periodList">${a.activePeriods.map((p,i)=>`<div class="periodRow"><div class="field"><label for="pstart_${i}">Inizio</label><input id="pstart_${i}" type="datetime-local" value="${esc(p.start)}" data-period-start="${i}"></div><div class="field"><label for="pend_${i}">Fine <span class="optional">(facoltativa)</span></label><input id="pend_${i}" type="datetime-local" value="${esc(p.end)}" data-period-end="${i}"></div><button class="miniBtn" data-remove-period="${i}" type="button" title="Elimina periodo">${svg('trash')}</button></div>`).join('')}</div>`:`<div class="empty" style="padding:35px"><strong>Nessun periodo impostato</strong><span>L’avviso non ha un limite temporale finché non aggiungi un periodo.</span></div>`}<div class="callout info" style="margin-top:12px"><div>${svg('clock')}</div><div><strong>Il periodo dell’avviso non è l’orario della corsa.</strong><span>Gli orari GTFS possono superare 23:59:59 e non vengono modificati dall’editor.</span></div></div></section>`;}

function editorIdentity(){const a=state.editor;const existing=!!state.editorOriginal;return `<section class="card"><div class="cardHeader"><div><div class="cardTitle">Identificazione</div><div class="cardHint">Informazioni tecniche secondarie, senza dominare l’editor.</div></div></div><div class="sectionGrid"><div class="stack">${field('alertId','ID avviso',a.id,existing?'':'disabled')}<div class="field"><label class="switch"><input id="enabledToggle" type="checkbox" ${a.enabled?'checked':''} ${existing?'':'disabled'}><span>Attivo</span></label>${existing?`<div class="fieldHint">Cambiare questo stato è una modifica pubblicabile.</div>`:''}</div></div><div class="stack"><div class="repoBox"><div class="repoLine"><span>Creato</span><strong class="small">${esc(a.createdAt||'—')}</strong></div><div class="repoLine"><span>Ultima modifica</span><strong class="small">${esc(a.updatedAt||'—')}</strong></div><div class="repoLine"><span>Editor</span><strong class="small">${esc(a.createdBy||state.config.editorName||'—')}</strong></div></div></div></div></section>`;}

 document.querySelectorAll('.addTrans').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.prefix;document.querySelector(`#${p}Rows`).insertAdjacentHTML('beforeend',`<div class="translationRow" data-trans-row="${p}"><input class="transLang" value="" aria-label="Lingua"><textarea class="transText" aria-label="Testo" style="min-height:80px"></textarea><button class="miniBtn removeTrans" type="button" aria-label="Rimuovi lingua">${svg('x')}</button></div>`);bindTranslationRemove();}));bindTranslationRemove();

}

function gtfsStatusLabel(){return state.gtfs.status==='none'?'Nessun GTFS':state.gtfs.status==='loading'?'Caricamento in corso…':state.gtfs.status==='loaded'?'GTFS caricato':'Errore';}
function parseCSV(text,name='CSV'){
 const src=String(text??'').replace(/^\uFEFF/,'');
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<src.length;i++){
  const ch=src[i];
  if(quoted){if(ch==='"'){if(src[i+1]==='"'){cell+='"';i++;}else{quoted=false;}}else cell+=ch;continue;}
  if(ch==='"'){quoted=true;continue;}
  if(ch===','){row.push(cell);cell='';continue;}
  if(ch==='\r'){if(src[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue;}
  if(ch==='\n'){row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue;}
  cell+=ch;
 }
 if(quoted)throw new Error(`${name} non è valido: virgolette non chiuse.`);
 if(cell!==''||row.length){row.push(cell);if(row.some(v=>v!==''))rows.push(row);}
 if(!rows.length)throw new Error(`${name} è vuoto.`);
 const headers=rows[0].map(h=>String(h).trim());
 if(headers.some((h,i)=>!h||headers.indexOf(h)!==i))throw new Error(`${name} contiene intestazioni duplicate o vuote.`);
 return rows.slice(1).map((r,ri)=>{if(r.length>headers.length)throw new Error(`${name}: riga ${ri+2} contiene più campi delle intestazioni.`);while(r.length<headers.length)r.push('');const o={};headers.forEach((h,i)=>o[h]=String(r[i]??'').trim());return o;});
}
function needField(rows,file,fieldName){if(!rows.length||!Object.prototype.hasOwnProperty.call(rows[0],fieldName))throw new Error(`${file}: manca il campo ${fieldName}.`);}
function buildGTFSIndex(entries){
 const e=entries||{};
 for(const k of ['agency.txt','routes.txt','stops.txt'])if(!e[k])throw new Error(`Manca ${k}.`);
 const agencyRows=parseCSV(e['agency.txt'],'agency.txt');const routeRows=parseCSV(e['routes.txt'],'routes.txt');const stopRows=parseCSV(e['stops.txt'],'stops.txt');
 needField(routeRows,'routes.txt','route_id');if(!Object.prototype.hasOwnProperty.call(routeRows[0],'route_short_name')&&!Object.prototype.hasOwnProperty.call(routeRows[0],'route_long_name'))throw new Error('routes.txt: serve route_short_name oppure route_long_name.');
 needField(stopRows,'stops.txt','stop_id');needField(stopRows,'stops.txt','stop_name');
 const tripsRows=e['trips.txt']?parseCSV(e['trips.txt'],'trips.txt'):[];const stRows=e['stop_times.txt']?parseCSV(e['stop_times.txt'],'stop_times.txt'):[];
 if(tripsRows.length){for(const f of ['trip_id','route_id','service_id','direction_id','start_time','trip_headsign'])if(Object.prototype.hasOwnProperty.call(tripsRows[0],f)===false&&f!=='start_time'){}needField(tripsRows,'trips.txt','trip_id');needField(tripsRows,'trips.txt','route_id');}
 if(stRows.length){for(const f of ['trip_id','stop_id','stop_sequence'])needField(stRows,'stop_times.txt',f);}
 const agencies=new Map();agencyRows.forEach((r,i)=>{const id=(r.agency_id||'agency_'+(i+1)).trim();if(!id)return;agencies.set(id,{...r,agency_id:id});});
 const routesById=new Map();routeRows.forEach(r=>{const id=r.route_id;if(id)routesById.set(id,r);});
 const stopsById=new Map();stopRows.forEach(r=>{const id=r.stop_id;if(id)stopsById.set(id,r);});
 const tripsById=new Map();tripsRows.forEach(r=>{const id=r.trip_id;if(id)tripsById.set(id,r);});
 const tripsByRoute=new Map(),tripsByRouteAndDirection=new Map(),stopTrips=new Map(),tripStops=new Map();
 for(const t of tripsRows){if(!t.trip_id||!t.route_id)continue;if(!tripsByRoute.has(t.route_id))tripsByRoute.set(t.route_id,[]);tripsByRoute.get(t.route_id).push(t);const dk=t.direction_id===''||t.direction_id==null?'':String(t.direction_id);const key=`${t.route_id}|${dk}`;if(!tripsByRouteAndDirection.has(key))tripsByRouteAndDirection.set(key,[]);tripsByRouteAndDirection.get(key).push(t);}
 for(const st of stRows){if(!tripStops.has(st.trip_id))tripStops.set(st.trip_id,[]);tripStops.get(st.trip_id).push(st);if(!stopTrips.has(st.stop_id))stopTrips.set(st.stop_id,[]);}
 for(const arr of tripStops.values())arr.sort((a,b)=>(Number(a.stop_sequence)||0)-(Number(b.stop_sequence)||0));
 for(const [stopId] of stopTrips){const arr=[];for(const st of stRows.filter(x=>x.stop_id===stopId)){const t=tripsById.get(st.trip_id);if(t&&!arr.some(x=>x.trip_id===t.trip_id))arr.push(t);}arr.sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||''),undefined,{numeric:true})||a.trip_id.localeCompare(b.trip_id));stopTrips.set(stopId,arr);}
 const routePatterns=new Map();for(const [key,trips] of tripsByRouteAndDirection){const patterns=new Map();for(const t of trips){const sts=tripStops.get(t.trip_id)||[];const seq=sts.map(st=>st.stop_id).filter(id=>stopsById.has(id));if(!seq.length)continue;const pkey=seq.join('\u001f');let p=patterns.get(pkey);if(!p){p={key:pkey,count:0,tripIds:[],headsign:t.trip_headsign||'',stops:seq.map(id=>stopsById.get(id))};patterns.set(pkey,p);}p.count++;if(p.tripIds.length<20)p.tripIds.push(t.trip_id);if(!p.headsign&&t.trip_headsign)p.headsign=t.trip_headsign;}
  const sorted=[...patterns.values()].sort((a,b)=>b.count-a.count||a.key.localeCompare(b.key)).map((p,index)=>({...p,index}));routePatterns.set(key,sorted);}
 return {agencies,routesById,stopsById,tripsById,tripsByRoute,tripsByRouteAndDirection,stopTrips,tripStops,routePatterns};
}
function gtfsEntryNames(zip){return Object.keys(zip.files).filter(k=>!zip.files[k].dir).map(k=>k.replace(/^.*\//,''));}
async function loadGTFS(url,operator=null){
 const my=++state.gtfs.requestId;const target=state.gtfs;
 target.status='loading';target.error='';target.data=null;target.metrics=null;target.operator=operator||null;target.url=url; if(state.page==='gtfs')renderGTFS(); else renderShell();
 try{
  if(!isURL(url))throw new Error('L’URL GTFS deve usare http o https.');
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);
  let r;try{r=await fetch(url,{cache:'no-store',signal:controller.signal});}finally{clearTimeout(timer);}
  if(my!==state.gtfs.requestId)return;
  if(!r.ok)throw new Error(`Errore HTTP ${r.status} durante il caricamento GTFS.`);
  const cl=Number(r.headers.get('content-length')||0);if(cl>100*1024*1024)throw new Error('Il feed GTFS supera il limite pratico di 100 MB.');
  const bytes=new Uint8Array(await r.arrayBuffer());if(bytes.byteLength>100*1024*1024)throw new Error('Il feed GTFS supera il limite pratico di 100 MB.');
  let zip;try{zip=await JSZip.loadAsync(bytes);}catch(e){throw new Error('Il file scaricato non è uno ZIP GTFS valido.');}
  const names=gtfsEntryNames(zip);const allowed=['agency.txt','routes.txt','stops.txt','trips.txt','stop_times.txt'];const entries={};for(const name of allowed){const path=names.find(n=>n.toLowerCase()===name);if(path)entries[name]=await zip.files[Object.keys(zip.files).find(k=>k.replace(/^.*\//,'')===path)].async('string');}
  const data=buildGTFSIndex(entries);if(my!==state.gtfs.requestId)return;
  state.gtfs.data=data;state.gtfs.status='loaded';state.gtfs.operator=operator||null;state.gtfs.url=url;state.gtfs.metrics={routes:data.routesById.size,stops:data.stopsById.size,trips:data.tripsById.size,agencies:data.agencies.size,stopsWithTrips:[...data.stopTrips.values()].filter(a=>a.length).length};
  toast('GTFS caricato',`${operator?.name||'Feed personalizzato'}: ${state.gtfs.metrics.routes} linee, ${state.gtfs.metrics.stops} fermate, ${state.gtfs.metrics.trips} corse.`,'ok');if(state.page==='gtfs')renderGTFS();else renderShell();
 }catch(e){if(my!==state.gtfs.requestId)return;state.gtfs.status='error';state.gtfs.error=e.name==='AbortError'?'Timeout durante il caricamento GTFS.':(e.message||'Errore GTFS');toast('Caricamento GTFS fallito',state.gtfs.error,'err');if(state.page==='gtfs')renderGTFS();else renderShell();}
}

function validateGithubConfig(){const c=state.config;const missing=[];if(!c.owner?.trim())missing.push('Proprietario / organizzazione');if(!c.repo?.trim())missing.push('Repository');if(!c.branch?.trim())missing.push('Branch');if(!c.jsonPath?.trim())missing.push('Percorso alerts.json');if(!c.pbPath?.trim())missing.push('Percorso alerts.pb');if(missing.length)throw new Error(`Completa la configurazione GitHub: ${missing.join(', ')}.`);const badPath=v=>v.startsWith('/')||v.includes('..')||v.endsWith('/');if(c.jsonPath===c.pbPath)throw new Error('alerts.json e alerts.pb devono avere percorsi diversi.');if(badPath(c.jsonPath))throw new Error('Il percorso di alerts.json deve essere relativo al repository e non contenere ..');if(badPath(c.pbPath))throw new Error('Il percorso di alerts.pb deve essere relativo al repository e non contenere ..');}
function ghRefPath(branch){return branch.split('/').map(encodeURIComponent).join('/');}
async function gh(path,options={}){const headers={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10',...options.headers};if(state.config.token)headers.Authorization=`Bearer ${state.config.token}`;const r=await fetch('https://api.github.com'+path,{...options,headers});let data=null;const ct=r.headers.get('content-type')||'';if(ct.includes('application/json')){try{data=await r.json();}catch(e){data=null;}}else{data=await r.text();}if(!r.ok)throw new Error(`${r.status} ${data?.message||'Errore GitHub'}`);return data;}
async function ghJsonFile(path,branch){const data=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(branch)}`);return data;}
function mergeLocalChangesOntoRemote(remoteAlerts, localAlerts, baselineAlerts){
 const baselineById=new Map((baselineAlerts||[]).map(a=>[a.id,normalizeAlert(a)]));
 const localById=new Map((localAlerts||[]).map(a=>[a.id,normalizeAlert(a)]));
 const remoteById=new Map((remoteAlerts||[]).map(a=>[a.id,normalizeAlert(a)]));
 const result=[];
 const locallyModifiedIds=new Set();
 const locallyDeletedIds=new Set();
 for(const [id,base] of baselineById){
   const local=localById.get(id);
   if(!local){ locallyDeletedIds.add(id); continue; }
   if(JSON.stringify(local)!==JSON.stringify(base)) locallyModifiedIds.add(id);
 }
 for(const remote of remoteAlerts||[]){
   const id=remote.id;
   if(locallyDeletedIds.has(id)){
     continue;
   }
   if(locallyModifiedIds.has(id)){
     result.push(localById.get(id));
   }else{
     result.push(remote);
   }
 }
 const remoteIds=new Set((remoteAlerts||[]).map(a=>a.id));
 for(const local of localAlerts||[]){
   if(!remoteIds.has(local.id) && !baselineById.has(local.id)) result.push(local);
 }
 return {alerts:result, locallyModifiedIds:[...locallyModifiedIds], locallyDeletedIds:[...locallyDeletedIds]};
}

async function reloadRemote(){
 try{
  validateGithubConfig();
  const hadLocalChanges=!!state.localDirty;
  const previousLocal=clone(state.alerts);
  const previousBaseline=clone(state.remoteBaseline||[]);
  if(hadLocalChanges && !confirm('Esistono modifiche locali non pubblicate. Verrà caricata l’ultima versione remota mantenendo le modifiche locali quando possibile. Continuare?'))return;
  state.publication.status='publishing';
  state.remote.conflict=false;
  state.remote.loaded=false;
  renderHome();
  const branch=state.config.branch;
  const ref=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/ref/heads/${ghRefPath(branch)}`);
  const head=ref.object.sha;
  const commit=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/commits/${encodeURIComponent(head)}`);
  let jsonSha=null,pbSha=null,parsed=null,shape='object',extras={},jsonMissing=false;
  try{
   const j=await ghJsonFile(state.config.jsonPath,branch);
   jsonSha=j.sha;
   let text;
   if(j.encoding==='base64'&&j.content!=null){text=decodeBase64ToText(j.content);}else{const raw=await fetch(j.download_url,{cache:'no-store'});text=await raw.text();}
   parsed=datasetParse(text);shape=parsed.shape;extras=parsed.extras||{};
  }catch(e){
   if(String(e.message).startsWith('404')){jsonMissing=true;parsed={alerts:[],shape:'object',extras:{}};}
   else throw new Error(e.message||'alerts.json remoto non valido.');
  }
  try{const p=await ghJsonFile(state.config.pbPath,branch);pbSha=p.sha;}catch(e){if(!String(e.message).startsWith('404'))throw e;}
  const remoteAlerts=parsed.alerts||[];
  let mergedAlerts=remoteAlerts;
  let mergedMessage='Ultima versione remota caricata.';
  if(hadLocalChanges){
    const merged=mergeLocalChangesOntoRemote(remoteAlerts,previousLocal,previousBaseline);
    mergedAlerts=merged.alerts;
    state.remoteBaseline=clone(remoteAlerts);
    state.localDirty=JSON.stringify(mergedAlerts)!==JSON.stringify(remoteAlerts);
    mergedMessage=state.localDirty?'Versione remota aggiornata: le modifiche locali sono state mantenute.':'Ultima versione remota caricata: non c’erano modifiche locali effettive da mantenere.';
  }else{
    state.remoteBaseline=clone(remoteAlerts);
    state.localDirty=false;
  }
  state.alerts=mergedAlerts;
  state.meta=parsed.meta||state.meta;
  state.remote={contextKey:contextKey(),head,tree:commit.tree.sha,jsonSha,pbSha,loaded:true,remoteShape:shape,remoteTopExtras:extras,loadedAt:nowISO(),conflict:false};
  state.publication.status=state.localDirty?'dirty':'sync';
  persistSettings();
  toast(state.localDirty?'Modifiche locali mantenute':'Sincronizzato',jsonMissing&&pbSha?'alerts.json non esiste ma alerts.pb è presente. Verrà creato il JSON alla prima pubblicazione.':mergedMessage,state.localDirty?'warn':'ok');
  renderShell();
 }catch(e){
  state.publication.status=state.localDirty?'dirty':'sync';
  toast('Ricarica non riuscita',e.message||'Errore inatteso.','err');
  renderShell();
 }
}
function decodeBase64ToText(b64){const bin=atob(b64.replace(/\s/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}
function base64FromBytes(bytes){let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+chunk)));return btoa(binary);}

async function publishAgainstSnapshot(){
 const c=state.config;const actor=c.editorName.trim()||'Console Avvisi GTFS-RT';const publicationTime=nowISO();const metaForPublish={...state.meta,lastEditedBy:actor,lastEditedAt:publicationTime};let stage='preparazione';

  stage='creazione blob JSON';const jsonBlob=await gh(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/blobs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:base64FromBytes(new TextEncoder().encode(jsonText)),encoding:'base64'})});

  stage='aggiornamento branch';const ref=await gh(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/refs/heads/${ghRefPath(c.branch)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sha:commit.sha,force:false})});
  stage='verifica branch';const verify=await gh(`/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/ref/heads/${ghRefPath(c.branch)}`);if(verify.object?.sha!==commit.sha)throw new Error('GitHub non conferma il nuovo commit come HEAD del branch. Le modifiche locali sono state mantenute.');

async function publish(){if(!state.localDirty){toast('Nessuna modifica','Il dataset è già sincronizzato.','info');return;}try{validateGithubConfig();if(!state.remote.loaded||state.remote.contextKey!==contextKey())throw new Error('Carica prima l’ultima versione remota per questo contesto.');const errors=datasetValidation(true);if(errors.length){showValidation(errors);return;}state.publication.status='publishing';updateTopStatus();const ref=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/ref/heads/${ghRefPath(state.config.branch)}`);const currentHead=ref.object.sha;if(currentHead!==state.remote.head){const cmt=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/commits/${encodeURIComponent(currentHead)}`);state.publication.status='conflict';state.remote.conflict=true;openConflictModal(currentHead,cmt.tree.sha);return;}await publishAgainstSnapshot();}catch(e){state.publication.status='dirty';try{if(String(e.message||'').includes('409')||String(e.message||'').includes('422')){const ref=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/ref/heads/${ghRefPath(state.config.branch)}`);const cmt=await gh(`/repos/${encodeURIComponent(state.config.owner)}/${encodeURIComponent(state.config.repo)}/git/commits/${encodeURIComponent(ref.object.sha)}`);state.publication.status='conflict';state.remote.conflict=true;openConflictModal(ref.object.sha,cmt.tree.sha);return;}}catch(_e){}toast('Pubblicazione fallita',e.message||'Errore inatteso.','err');updateTopStatus();}}

function openConfigFilePicker(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const text=await input.files[0].text();const v=JSON.parse(text);if(!v||typeof v!=='object'||Array.isArray(v))throw new Error('La configurazione deve essere un oggetto JSON.');const strings=['owner','repo','branch','jsonPath','pbPath','editorName','selectedOperator','customGtfsUrl'];for(const k of strings)if(v[k]!=null&&typeof v[k]!=='string')throw new Error(`Il campo ${k} deve essere una stringa.`);for(const k of strings)if(v[k]!=null)state.config[k]=v[k];if(v.pathsTouched&&typeof v.pathsTouched==='object'){state.config.pathsTouched={...state.config.pathsTouched,jsonPath:!!v.pathsTouched.jsonPath,pbPath:!!v.pathsTouched.pbPath};}persistSettings();toast('Configurazione importata','Il token non è stato modificato.','ok');renderSettings();}catch(e){toast('Importazione fallita',e.message||'Configurazione non valida.','err');}};input.click();}
function downloadBytes(bytes,name,type){const blob=new Blob([bytes],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function renderGuide(){document.getElementById('content').innerHTML=`<div class="pageHeader"><div><h1 class="pageTitle">Guida operativa</h1><p class="pageSub">Una guida pensata per chi gestisce il servizio, non per chi deve conoscere protobuf.</p></div></div><div class="sectionGrid"><section class="card"><div class="cardTitle">1. Crea</div><div class="cardHint">Home → Nuovo avviso · Da zero. Il nuovo avviso parte attivo e senza periodi o entità fantasma.</div></section><section class="card"><div class="cardTitle">2. Definisci</div><div class="cardHint">Compila messaggio, classificazione, ambito, periodo e comunicazione. Cambiare sezione non ricrea il draft.</div></section><section class="card"><div class="cardTitle">3. Ambito</div><div class="cardHint">Carica il GTFS quando devi scegliere nuove linee, fermate, corse o percorsi. L’editor rimane utilizzabile anche senza un nuovo GTFS per modifiche non dipendenti dal catalogo.</div></section><section class="card"><div class="cardTitle">4. Salva</div><div class="cardHint">“Salva avviso” modifica solo il dataset locale. Da quel momento compare “Modifiche non pubblicate”.</div></section><section class="card"><div class="cardTitle">5. Pubblica</div><div class="cardHint">“Pubblica” valida il dataset, costruisce il protobuf binario e aggiorna JSON + PB nello stesso commit Git.</div></section><section class="card"><div class="cardTitle">6. Conflitto</div><div class="cardHint">Se il repository è cambiato, la console non sovrascrive. Puoi ricaricare il remoto oppure scegliere consapevolmente una nuova pubblicazione dopo aver riallineato il contesto.</div></section><section class="card"><div class="cardTitle">7. Periodi</div><div class="cardHint">Puoi avere più intervalli. Una fine vuota significa nessuna fine. Un alert senza periodi resta senza limite temporale secondo la logica della console.</div></section><section class="card"><div class="cardTitle">8. Preview</div><div class="cardHint">La preview esegue encode → decode dello stesso protobuf che verrebbe pubblicato e separa chiaramente dataset JSON e feed operativo.</div></section></div>`;}
function openModal(title,body,actions=[]){const host=document.getElementById('modalBackdrop');host.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modalHeader"><div class="modalTitle">${esc(title)}</div><button class="iconBtn" id="modalX" aria-label="Chiudi">${svg('x')}</button></div><div class="modalBody">${body}</div><div class="modalFooter" id="modalFooter"></div></div>`;host.classList.add('open');host.setAttribute('aria-hidden','false');document.getElementById('modalX').onclick=closeModal;const f=document.getElementById('modalFooter');for(const a of actions){const b=document.createElement('button');b.className=a.className||'btnGhost';b.innerHTML=a.label; b.onclick=a.action;f.appendChild(b);}setTimeout(()=>host.querySelector('button,input,select,textarea')?.focus(),50);}
function closeModal(){const h=document.getElementById('modalBackdrop');h.classList.remove('open');h.setAttribute('aria-hidden','true');h.innerHTML='';}
function toast(title,message,type='info'){const host=document.getElementById('toastHost');const div=document.createElement('div');div.className='toast';div.innerHTML=`<div>${type==='ok'?svg('check'):type==='err'?svg('alert'):svg('info')}</div><div><strong>${esc(title)}</strong><span>${esc(message)}</span></div>`;host.appendChild(div);setTimeout(()=>div.remove(),5200);}
async function init(){restoreSettings();const saved=restoreContext();if(saved?.alerts?.length){if(confirm('Sono presenti avvisi locali ripristinabili per questo contesto. Vuoi recuperarli?')){state.alerts=saved.alerts.map(normalizeAlert);state.remoteBaseline=saved.baseline?saved.baseline.map(normalizeAlert):[];state.localDirty=true;state.publication.status='dirty';toast('Avvisi locali ripristinati','Il repository remoto resta la fonte di verità: verifica e pubblica quando sei pronto.','warn');}}renderShell();}
window.addEventListener('beforeunload',e=>{if(state.localDirty){e.preventDefault();e.returnValue='';}});
init();
})();
</script>
